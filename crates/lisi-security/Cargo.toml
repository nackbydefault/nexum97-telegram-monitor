[package]
name = "lisi-security"
description = "Protezione locale dei segreti di NEXUM/97"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
argon2.workspace = true
# La copia cifrata (ENCRYPT-01, ADR-0175): AES-256-GCM di RustCrypto, la
# famiglia di `argon2`; `ring` resta del solo trasporto (ADR-0083).
aes-gcm.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
# Dichiarazioni generate dai metadati ufficiali Microsoft invece che scritte a
# mano: riprodurre a mano una struttura come CRYPT_INTEGER_BLOB e sbagliarne
# l'allineamento sarebbe un errore silenzioso. Vedere ADR-0009.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    # I permessi del solo utente, applicati e riletti (ADR-0206).
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.24.0"
